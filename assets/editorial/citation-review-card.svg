<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>Keep a claim review record</title><rect width="760" height="540" rx="24" fill="#f5f6f1"/><g font-family="Arial,sans-serif" fill="#173229"><text x="35" y="58" font-size="34" font-weight="700">Keep a claim review record</text><rect x="30" y="90" width="700" height="95" rx="14" fill="white"/><text x="50" y="129" font-size="30" font-weight="700">Claim + source</text><text x="50" y="164" font-size="28">Write the claim and source date.</text><rect x="30" y="195" width="700" height="95" rx="14" fill="white"/><text x="50" y="234" font-size="30" font-weight="700">Supporting passage</text><text x="50" y="269" font-size="28">Copy the evidence you checked.</text><rect x="30" y="300" width="700" height="95" rx="14" fill="white"/><text x="50" y="339" font-size="30" font-weight="700">Missing or conflicting detail</text><text x="50" y="374" font-size="28">Do not fill a gap from context.</text><rect x="30" y="405" width="700" height="95" rx="14" fill="white"/><text x="50" y="444" font-size="30" font-weight="700">Decision + corrected sentence</text><text x="50" y="479" font-size="28">Save the repair with the input.</text></g></svg>