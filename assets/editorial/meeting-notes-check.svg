<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>Four meeting-note checkpoints</title><rect width="760" height="540" rx="24" fill="#f5f6f1"/><g font-family="Arial,sans-serif" fill="#173229"><text x="35" y="58" font-size="34" font-weight="700">Before you share meeting notes</text><rect x="30" y="90" width="700" height="95" rx="14" fill="white"/><text x="50" y="129" font-size="30" font-weight="700">1. Choose your source</text><text x="50" y="164" font-size="28">Written notes, recording or live capture?</text><rect x="30" y="195" width="700" height="95" rx="14" fill="white"/><text x="50" y="234" font-size="30" font-weight="700">2. Check the limits</text><text x="50" y="269" font-size="28">Length, uploads, summaries and export.</text><rect x="30" y="300" width="700" height="95" rx="14" fill="white"/><text x="50" y="339" font-size="30" font-weight="700">3. Verify commitments</text><text x="50" y="374" font-size="28">Decisions, owners, dates and conditions.</text><rect x="30" y="405" width="700" height="95" rx="14" fill="white"/><text x="50" y="444" font-size="30" font-weight="700">4. Save the reviewed handoff</text><text x="50" y="479" font-size="28">Reopen the result and inspect access.</text></g></svg>