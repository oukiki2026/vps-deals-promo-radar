<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">One change. Three places to check.</title><desc id="desc">A document update is the start of the check. Check each copy. Do not assume updates travel.</desc><rect width="760" height="650" rx="24" fill="#f5f6f1"/><g font-family="Arial,sans-serif" fill="#173229"><text x="32" y="48" font-size="28" font-weight="700">One change. Three places to check.</text><text x="32" y="83" font-size="20">A document update is the start of the check.</text><rect x="28" y="112" width="704" height="126" rx="16" fill="#fff" stroke="#d8ded4"/><text x="48" y="142" font-size="19" font-weight="700">01  ORIGINAL DOCUMENT</text><text x="48" y="176" font-size="23">Which version applies to this task?</text><text x="48" y="211" font-size="20">Find one changed date, count or owner.</text><rect x="28" y="262" width="704" height="126" rx="16" fill="#fff" stroke="#d8ded4"/><text x="48" y="292" font-size="19" font-weight="700">02  SOURCE AVAILABLE TO AI</text><text x="48" y="326" font-size="23">Does the imported content match?</text><text x="48" y="361" font-size="20">Inspect the contents; a filename is not enough.</text><rect x="28" y="412" width="704" height="126" rx="16" fill="#fff" stroke="#d8ded4"/><text x="48" y="442" font-size="19" font-weight="700">03  SAVED RESULT</text><text x="48" y="476" font-size="23">Does the file you will share match?</text><text x="48" y="511" font-size="20">Ask again, save a new copy, reopen it.</text><text x="32" y="611" font-size="21">Check each copy. Do not assume updates travel.</text></g></svg>