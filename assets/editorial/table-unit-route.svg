<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img"><title>Keep the number, unit and source</title><rect width="760" height="640" rx="24" fill="#f3f6fa"/><text x="38" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17283b">Keep the number, unit and source</text><rect x="32" y="104" width="696" height="136" rx="16" fill="white"/><text x="56" y="145" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17283b">1. Preserve the input</text><text x="56" y="185" font-family="Arial,sans-serif" font-size="24" fill="#334f65">C2: green paint = 0.5 L</text><text x="56" y="215" font-family="Arial,sans-serif" font-size="22" fill="#334f65">Keep source_value 0.5 and source_unit L.</text><rect x="32" y="260" width="696" height="136" rx="16" fill="white"/><text x="56" y="301" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17283b">2. Normalize only compatible units</text><text x="56" y="341" font-family="Arial,sans-serif" font-size="24" fill="#334f65">0.5 L × 1000 = 500 mL</text><text x="56" y="371" font-family="Arial,sans-serif" font-size="22" fill="#334f65">Missing unit? Keep the volume field empty.</text><rect x="32" y="416" width="696" height="136" rx="16" fill="#e0eee8"/><text x="56" y="457" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17283b">3. Label the subtotal</text><text x="56" y="497" font-family="Arial,sans-serif" font-size="24" fill="#334f65">250 + 500 + 750 = 1500 mL</text><text x="56" y="527" font-family="Arial,sans-serif" font-size="22" fill="#334f65">C4 unresolved · C5 mass excluded</text><text x="38" y="612" font-family="Arial,sans-serif" font-size="18" fill="#526b7f">KIKOMONO · Invented Cedar practice notes</text></svg>

