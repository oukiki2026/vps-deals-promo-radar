<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>Three routes, different conditions</title><rect width="760" height="540" fill="#f5f7fb"/><g font-family="Arial, sans-serif" fill="#192a40"><text x="30" y="48" font-size="30" font-weight="700">Three routes, different conditions</text><rect x="30" y="75" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="107" font-size="25" font-weight="700">Hobby: free plan</text><text x="50" y="140" font-size="24">No credit card required.</text><text x="50" y="170" font-size="24">Limited Agent requests.</text><rect x="30" y="215" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="247" font-size="25" font-weight="700">MLH: conditional Pro offer</text><text x="50" y="280" font-size="24">Use the emailed code; check the actual terms.</text><text x="50" y="310" font-size="24">Confirm the account outcome after redemption.</text><rect x="30" y="355" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="387" font-size="25" font-weight="700">Campus: event announcements</text><text x="50" y="420" font-size="24">Look for a current, specific promotion.</text><text x="50" y="450" font-size="24">An announcement is not a Pro entitlement.</text></g></svg>