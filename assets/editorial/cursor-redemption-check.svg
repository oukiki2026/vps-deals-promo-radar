<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>Check a promotion in four steps</title><rect width="760" height="540" fill="#f5f7fb"/><g font-family="Arial, sans-serif" fill="#192a40"><text x="30" y="48" font-size="30" font-weight="700">Check a promotion in four steps</text><rect x="30" y="75" width="700" height="100" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="107" font-size="25" font-weight="700">1. Read the offer</text><text x="50" y="140" font-size="24">Eligibility, duration and allowance.</text><rect x="30" y="190" width="700" height="100" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="222" font-size="25" font-weight="700">2. Compare checkout</text><text x="50" y="255" font-size="24">Amount due now and renewal terms.</text><rect x="30" y="305" width="700" height="100" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="337" font-size="25" font-weight="700">3. Confirm the account</text><text x="50" y="370" font-size="24">Look for the redeemed benefit on the dashboard.</text><rect x="30" y="420" width="700" height="100" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="452" font-size="25" font-weight="700">4. Save redacted evidence</text><text x="50" y="485" font-size="24">Keep unknowns explicit; ask before assuming.</text></g></svg>