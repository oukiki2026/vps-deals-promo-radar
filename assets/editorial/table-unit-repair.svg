<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img"><title>Repair one row, then recalculate</title><rect width="760" height="640" rx="24" fill="#f3f6fa"/><text x="38" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17283b">Repair one row, then recalculate</text><rect x="32" y="104" width="696" height="136" rx="16" fill="white"/><text x="56" y="145" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17283b">Wrong conversion: C2 = 0.5 mL</text><text x="56" y="185" font-family="Arial,sans-serif" font-size="24" fill="#334f65">Source C2 says 0.5 L; correct to 500 mL.</text><text x="56" y="215" font-family="Arial,sans-serif" font-size="22" fill="#334f65">Do not multiply already-correct mL rows.</text><rect x="32" y="260" width="696" height="136" rx="16" fill="white"/><text x="56" y="301" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17283b">New source: C4a confirms 40 mL</text><text x="56" y="341" font-family="Arial,sans-serif" font-size="24" fill="#334f65">Keep the clarification with the corrected row.</text><text x="56" y="371" font-family="Arial,sans-serif" font-size="22" fill="#334f65">1500 + 40 = 1540 mL after confirmation.</text><rect x="32" y="416" width="696" height="136" rx="16" fill="#e0eee8"/><text x="56" y="457" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17283b">Still excluded: C5 = 100 g</text><text x="56" y="497" font-family="Arial,sans-serif" font-size="24" fill="#334f65">Mass is not volume.</text><text x="56" y="527" font-family="Arial,sans-serif" font-size="22" fill="#334f65">Keep C5 and its source unit separate.</text><text x="38" y="612" font-family="Arial,sans-serif" font-size="18" fill="#526b7f">KIKOMONO · Invented Cedar practice notes</text></svg>

