<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>Before you use an AI answer</title><rect width="760" height="540" rx="24" fill="#f5f6f1"/><g font-family="Arial,sans-serif" fill="#173229"><text x="35" y="58" font-size="34" font-weight="700">Before you use an AI answer</text><rect x="30" y="90" width="700" height="95" rx="14" fill="white"/><text x="50" y="129" font-size="30" font-weight="700">1. Isolate the claim</text><text x="50" y="164" font-size="28">Split dates, conditions and features.</text><rect x="30" y="195" width="700" height="95" rx="14" fill="white"/><text x="50" y="234" font-size="30" font-weight="700">2. Open the original source</text><text x="50" y="269" font-size="28">Read the passage in context.</text><rect x="30" y="300" width="700" height="95" rx="14" fill="white"/><text x="50" y="339" font-size="30" font-weight="700">3. Compare each detail</text><text x="50" y="374" font-size="28">Check version, subject and conditions.</text><rect x="30" y="405" width="700" height="95" rx="14" fill="white"/><text x="50" y="444" font-size="30" font-weight="700">4. Retain, repair or withhold</text><text x="50" y="479" font-size="28">Keep unresolved details visible.</text></g></svg>