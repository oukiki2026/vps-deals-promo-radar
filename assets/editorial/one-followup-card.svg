<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title"><title id="title">Ask one useful question</title><rect width="760" height="590" rx="24" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#182735"><text x="36" y="55" font-size="32" font-weight="700">Ask one useful question</text><text x="36" y="94" font-size="26">Linden clinic — fictional practice notes</text><rect x="28" y="128" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="166" font-size="28" font-weight="700" fill="#145b67">Ask Lee to name the sender</text><text x="48" y="205" font-size="26">Sender: UNKNOWN until a reply.</text><text x="48" y="241" font-size="26">Reminders remain unsent.</text><rect x="28" y="290" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="328" font-size="28" font-weight="700" fill="#145b67">Reply: Pat handles reminders</text><text x="48" y="367" font-size="26">Update only the sender to Pat.</text><text x="48" y="403" font-size="26">Keep the reply beside the brief.</text></g></svg>