<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Harbor workshop: version A → B</title><desc id="desc">Invented notes with a worked answer. Use values from B together, then check the export.</desc><rect width="760" height="650" rx="24" fill="#f5f6f1"/><g font-family="Arial,sans-serif" fill="#173229"><text x="32" y="48" font-size="28" font-weight="700">Harbor workshop: version A → B</text><text x="32" y="83" font-size="20">Invented notes with a worked answer.</text><rect x="28" y="112" width="704" height="126" rx="16" fill="#fff" stroke="#d8ded4"/><text x="48" y="142" font-size="19" font-weight="700">DATE &amp; GUESTS</text><text x="48" y="176" font-size="23">October 18 → October 21</text><text x="48" y="211" font-size="20">10 confirmed guests → 12 confirmed guests</text><rect x="28" y="262" width="704" height="126" rx="16" fill="#fff" stroke="#d8ded4"/><text x="48" y="292" font-size="19" font-weight="700">OWNER &amp; ARITHMETIC</text><text x="48" y="326" font-size="23">Kai → Ren</text><text x="48" y="361" font-size="20">14 capacity − 12 confirmed = 2 seats</text><rect x="28" y="412" width="704" height="126" rx="16" fill="#fff" stroke="#d8ded4"/><text x="48" y="442" font-size="19" font-weight="700">APPROVAL</text><text x="48" y="476" font-size="23">Venue approval is still pending.</text><text x="48" y="511" font-size="20">Keep the guest email unsent.</text><text x="32" y="611" font-size="21">Use values from B together, then check the export.</text></g></svg>