<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img"><title>Finish the task outside the chat</title><rect width="760" height="600" rx="24" fill="#f5f6f1"/><g font-family="Arial,sans-serif" fill="#173229"><text x="40" y="60" font-size="36" font-weight="700">Finish the task outside the chat</text><rect x="30" y="94" width="700" height="98" rx="16" fill="white"/><text x="50" y="131" font-size="32" font-weight="700">1. Choose the destination</text><text x="50" y="170" font-size="30">What must you do with the result?</text><rect x="30" y="210" width="700" height="98" rx="16" fill="white"/><text x="50" y="247" font-size="32" font-weight="700">2. Export a small sample</text><text x="50" y="286" font-size="30">Keep the input and saved copy.</text><rect x="30" y="326" width="700" height="98" rx="16" fill="white"/><text x="50" y="363" font-size="32" font-weight="700">3. Reopen and edit</text><text x="50" y="402" font-size="30">Save one change, then reopen.</text><rect x="30" y="442" width="700" height="98" rx="16" fill="white"/><text x="50" y="479" font-size="32" font-weight="700">4. Compare the facts</text><text x="50" y="518" font-size="30">Check names, signs and table rows.</text></g></svg>