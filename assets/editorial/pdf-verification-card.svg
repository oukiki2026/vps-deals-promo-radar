<svg xmlns="http://www.w3.org/2000/svg" width="760" height="587" viewBox="0 0 760 587" role="img" aria-labelledby="title desc"><title id="title">Make a small verification record</title><desc id="desc">Example template: fill it with your own permitted material.</desc><rect width="760" height="587" rx="22" fill="#f5f6f1"/><g font-family="Arial, sans-serif" fill="#173229"><text x="36" y="54" font-size="28" font-weight="700">Make a small verification record</text><text x="36" y="90" font-size="18">Example template: fill it with your own permitted material.</text><rect x="36" y="132" width="688" height="88" rx="16" fill="white" stroke="#d8ded4"/><circle cx="76" cy="176" r="22" fill="#d7f969"/><text x="76" y="183" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="116" y="165" font-size="22" font-weight="700">Source page</text><text x="116" y="193" font-size="17">Record the page number and row / column heading.</text><rect x="36" y="240" width="688" height="88" rx="16" fill="white" stroke="#d8ded4"/><circle cx="76" cy="284" r="22" fill="#d7f969"/><text x="76" y="291" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="116" y="273" font-size="22" font-weight="700">Visible wording</text><text x="116" y="301" font-size="17">Read the original image before trusting extracted text.</text><rect x="36" y="348" width="688" height="88" rx="16" fill="white" stroke="#d8ded4"/><circle cx="76" cy="392" r="22" fill="#d7f969"/><text x="76" y="399" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="116" y="381" font-size="22" font-weight="700">Extracted wording</text><text x="116" y="409" font-size="17">Check minus signs, decimals, names and dates.</text><rect x="36" y="456" width="688" height="88" rx="16" fill="white" stroke="#d8ded4"/><circle cx="76" cy="500" r="22" fill="#d7f969"/><text x="76" y="507" text-anchor="middle" font-size="20" font-weight="700">4</text><text x="116" y="489" font-size="22" font-weight="700">Correction 