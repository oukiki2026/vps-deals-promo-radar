<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>Keep codes before adding amounts</title><rect width="760" height="540" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#192a40"><text x="30" y="48" font-size="30" font-weight="700">Keep codes before adding amounts</text><rect x="30" y="75" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="107" font-size="25" font-weight="700">Preserve the source</text><text x="50" y="140" font-size="24">Amount + confirmed code + source ID.</text><text x="50" y="170" font-size="24">Keep -2.00 as a negative refund.</text><rect x="30" y="215" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="247" font-size="25" font-weight="700">Group confirmed currencies</text><text x="50" y="280" font-size="24">USD 10.50 | CAD 8.00 | EUR 7.00</text><text x="50" y="310" font-size="24">These are separate known-amount subtotals.</text><rect x="30" y="355" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="387" font-size="25" font-weight="700">Keep unresolved rows visible</text><text x="50" y="420" font-size="24">M3: missing code. M6: missing amount.</text><text x="50" y="450" font-size="24">Do not invent USD, zero or an exchange rate.</text></g></svg>