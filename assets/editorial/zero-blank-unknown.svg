<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">Three different states</title><rect width="760" height="650" rx="24" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#182735"><text x="36" y="55" font-size="32" font-weight="700">Three different states</text><text x="36" y="94" font-size="26">Define the meaning before you export.</text><rect x="28" y="128" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="166" font-size="28" font-weight="700" fill="#145b67">0  Recorded zero</text><text x="48" y="205" font-size="26">Cables were checked: none found.</text><text x="48" y="241" font-size="26">Keep the zero.</text><rect x="28" y="290" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="328" font-size="28" font-weight="700" fill="#145b67">Empty  Awaiting entry</text><text x="48" y="367" font-size="26">No count supplied for paper.</text><text x="48" y="403" font-size="26">Keep the reason in status.</text><rect x="28" y="452" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="490" font-size="28" font-weight="700" fill="#145b67">UNKNOWN  Not checked</text><text x="48" y="529" font-size="26">Lamps have no checked count.</text><text x="48" y="565" font-size="26">Do not fill the gap with zero.</text></g></svg>