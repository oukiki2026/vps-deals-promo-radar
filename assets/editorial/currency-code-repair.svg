<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img"><title>One new fact changes one group</title><rect width="760" height="540" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#192a40"><text x="30" y="48" font-size="30" font-weight="700">One new fact changes one group</text><rect x="30" y="75" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="107" font-size="25" font-weight="700">Original answer</text><text x="50" y="140" font-size="24">USD 10.50 | CAD 8.00 | EUR 7.00</text><text x="50" y="170" font-size="24">M3 and M6 remain outside the subtotals.</text><rect x="30" y="215" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="247" font-size="25" font-weight="700">Clarification M3a: pen is CAD</text><text x="50" y="280" font-size="24">Update M3 only: CAD 8.00 + 5.00 = 13.00.</text><text x="50" y="310" font-size="24">USD and EUR stay unchanged.</text><rect x="30" y="355" width="700" height="125" rx="14" fill="white" stroke="#b8c7da"/><text x="50" y="387" font-size="25" font-weight="700">Save the evidence and reopen</text><text x="50" y="420" font-size="24">M6 still has no recorded amount.</text><text x="50" y="450" font-size="24">Check source IDs, codes and negative signs.</text></g></svg>