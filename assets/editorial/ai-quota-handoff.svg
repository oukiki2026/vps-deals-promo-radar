<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 380 540" role="img"><title>Keep four labelled parts</title><rect width="380" height="540" rx="12" fill="#f5f6f1"/><text x="20" y="30" font-family="Arial,sans-serif" font-size="13" fill="#607068">KIKOMONO / KEEP YOUR PROGRESS</text><text x="20" y="68" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#173229">Keep four labelled parts</text><rect x="15" y="86" width="350" height="90" rx="10" fill="white"/><text x="28" y="114" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#173229">1 / Original input</text><text x="28" y="139" font-family="Arial,sans-serif" font-size="17" fill="#526258">Keep relevant material</text><text x="28" y="161" font-family="Arial,sans-serif" font-size="17" fill="#526258">and its source labels.</text><rect x="15" y="187" width="350" height="90" rx="10" fill="white"/><text x="28" y="215" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#173229">2 / Checked facts</text><text x="28" y="240" font-family="Arial,sans-serif" font-size="17" fill="#526258">Separate evidence</text><text x="28" y="262" font-family="Arial,sans-serif" font-size="17" fill="#526258">from assumptions.</text><rect x="15" y="288" width="350" height="90" rx="10" fill="white"/><text x="28" y="316" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#173229">3 / Unfinished draft</text><text x="28" y="341" font-family="Arial,sans-serif" font-size="17" fill="#526258">Mark claims that still</text><text x="28" y="363" font-family="Arial,sans-serif" font-size="17" fill="#526258">need checking.</text><rect x="15" y="389" width="350" height="90" rx="10" fill="white"/><text x="28" y="417" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#173229">4 / One next action</text><text x="28" y="442" font-family="Arial,sans-serif" font-size="17" fill="#526258">Define a small task</text><text x="28" y="464" font-family="Arial,sans-serif" font-size="17" fill="#526258">and its finish.</text><text x="20" y="514" font-family="Arial,sans-serif" font-size="13" fill="#607068">Original exercise; not a product benchmark.</text></svg>