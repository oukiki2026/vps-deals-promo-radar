<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820" role="img" aria-labelledby="title"><title id="title">What is missing?</title><rect width="760" height="820" rx="24" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#182735"><text x="36" y="55" font-size="32" font-weight="700">What is missing?</text><text x="36" y="94" font-size="26">Compare the draft with the source.</text><rect x="28" y="128" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="166" font-size="28" font-weight="700" fill="#145b67">1  Present in the source</text><text x="48" y="205" font-size="26">Restore the omitted detail.</text><text x="48" y="241" font-size="26">Read the relevant passage.</text><rect x="28" y="290" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="328" font-size="28" font-weight="700" fill="#145b67">2  Absent from the source</text><text x="48" y="367" font-size="26">Keep UNKNOWN.</text><text x="48" y="403" font-size="26">Ask the person who can provide it.</text><rect x="28" y="452" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="490" font-size="28" font-weight="700" fill="#145b67">3  Conflicting instructions</text><text x="48" y="529" font-size="26">Preserve both notes.</text><text x="48" y="565" font-size="26">Ask which instruction applies.</text><rect x="28" y="614" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="652" font-size="28" font-weight="700" fill="#145b67">4  Approval still pending</text><text x="48" y="691" font-size="26">Keep the action on hold.</text><text x="48" y="727" font-size="26">An assigned sender is not approval.</text></g></svg>