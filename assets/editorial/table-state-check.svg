<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">Check the Juniper file</title><rect width="760" height="650" rx="24" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#182735"><text x="36" y="55" font-size="32" font-weight="700">Check the Juniper file</text><text x="36" y="94" font-size="26">Five fictional rows; no inferred counts.</text><rect x="28" y="128" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="166" font-size="28" font-weight="700" fill="#145b67">Three checked counts</text><text x="48" y="205" font-size="26">0 + 4 + 2 = 6</text><text x="48" y="241" font-size="26">This is a known subtotal.</text><rect x="28" y="290" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="328" font-size="28" font-weight="700" fill="#145b67">Two unresolved rows</text><text x="48" y="367" font-size="26">One UNKNOWN and one empty field.</text><text x="48" y="403" font-size="26">Keep both rows and their status.</text><rect x="28" y="452" width="704" height="140" rx="16" fill="white" stroke="#c6d2df"/><text x="48" y="490" font-size="28" font-weight="700" fill="#145b67">A complete total?</text><text x="48" y="529" font-size="26">Not available from these notes.</text><text x="48" y="565" font-size="26">Inspect the destination separately.</text></g></svg>