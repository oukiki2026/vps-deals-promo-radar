name: Verify official offers
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'site-config/**', 'templates/**', 'assets/**', 'tests/**', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: official-offer-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test conservative extraction and config changes
        run: python -m unittest discover -s tests -v
      - name: Fetch public official sources
        run: python scraper.py
      - name: Build and validate static output
        run: |
          python build.py
          python validate.py
      - name: Commit actual source-check records
        run: |
          git config user.name 'vps-deals source monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data README.md .github/workflows/update.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Update official source verification records'
          git push
